name: Booked Solid call contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all source
        run: python -m compileall -q jarvis connectors ops tests
      - name: Exercise delivery, checkout, bridge and repair contracts without providers
        run: python -m unittest discover -s tests -v
